# Host-level nginx vhost for dash.magies.top on qi (150.230.47.207).
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/dash.magies.top
#   sudo ln -sf ../sites-available/dash.magies.top /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name dash.magies.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dash.magies.top;

    ssl_certificate /etc/ssl/cloudflare/magies.top.crt;
    ssl_certificate_key /etc/ssl/cloudflare/magies.top.key;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
