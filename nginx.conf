# Host-level nginx vhost for dash.magies.top on aao-server (129.146.112.178).
#
# This server shares its nginx with other Magies sites (shell/dify/ai/…), so
# nginx runs on the host via systemd, not in a container. docker-compose.yml
# only publishes product-server / api / mail-gateway to 127.0.0.1 — this vhost
# is what makes them reachable on the public domain.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/conf.d/dash.magies.top.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ports match docker-compose.yml on this host (8410/8411 free; 8110/8090 busy).

server {
    listen 80;
    server_name dash.magies.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dash.magies.top;

    ssl_certificate     /etc/ssl/cf/dify_fullchain.pem;
    ssl_certificate_key /etc/ssl/cf/dify.magies.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    include /etc/nginx/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
