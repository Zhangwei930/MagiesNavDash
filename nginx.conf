# Host-level nginx vhost for dash.magies.top.
#
# This server shares its nginx with other sites (games.magies.top, hrp.magies.top,
# nav.magies.top), so nginx runs on the host via systemd, not in a container.
# docker-compose.yml only publishes product-server/api to 127.0.0.1 - this vhost
# is what makes them reachable on the public domain.
#
# Install by copying this file to /etc/nginx/sites-available/dash.magies.top on
# the server, then: ln -s ../sites-available/dash.magies.top /etc/nginx/sites-enabled/
# and reload nginx. Update the proxy_pass ports below if they differ from the
# ports product-server/api are published on in docker-compose.yml.

server {
    listen 80;
    server_name dash.magies.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dash.magies.top;

    ssl_certificate /etc/ssl/cloudflare/magies.top.crt;
    ssl_certificate_key /etc/ssl/cloudflare/magies.top.key;

    location /api/ {
        proxy_pass http://127.0.0.1:8111;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
