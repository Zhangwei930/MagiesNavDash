version: '3.9'

services:
  # Product Server (dash.magies.top) - reverse-proxied by the host's nginx (see nginx.conf), not exposed directly
  product-server:
    image: magies-hub/product
    build: .
    ports:
      - "127.0.0.1:8110:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8080
    depends_on:
      - api

  # API Server (Spring Boot) - reverse-proxied by the host's nginx, not exposed directly
  api:
    image: magies-hub/api
    build: ./backend
    ports:
      - "127.0.0.1:8111:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/magies
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 中设置数据库密码}
      - SPRING_REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  # Database
  postgres:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: magies
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置数据库密码}

  # Redis Cache
  redis:
    image: redis:7-alpine

  # Mail Gateway
  mail-gateway:
    image: magies-hub/mail-gateway
    build: ./mail-gateway
    ports:
      - "10025:25"  # SMTP port
    environment:
      - SMTP_HOST=smtp.google.com
      - SMTP_PORT=587

volumes:
  postgres_data:
