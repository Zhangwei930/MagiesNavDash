services:
  product-server:
    image: magies-hub/product
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8110:3000"
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: ""
    depends_on:
      - api

  api:
    image: magies-hub/api
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8111:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/magies
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_REDIS_HOST: redis
      MAIL_GATEWAY_URL: http://mail-gateway:8090
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: https://dash.magies.top,http://dash.magies.top
    depends_on:
      - postgres
      - redis
      - mail-gateway

  postgres:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: magies
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mail-gateway:
    image: magies-hub/mail-gateway
    build: ./mail-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      PORT: 8090
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}

volumes:
  postgres_data:
