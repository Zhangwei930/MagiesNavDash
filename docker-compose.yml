version: '3.9'

services:
  # Product Server (dash.magies.top)
  product-server:
    image: magies-hub/product
    build: .
    ports:
      - "80:80"
      - "443:443"  # HTTPS via Nginx
    environment:
      - NODE_ENV=production
      - API_URL=http://api.magies.top
    depends_on:
      - postgres
      - redis
      - api

  # API Server (Spring Boot)
  api:
    image: magies-hub/api
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/magies
      - SPRING_REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  # Database
  postgres:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: magies
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: magies123

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Mail Gateway (129.146.112.178)
  mail-gateway:
    image: magies-hub/mail-gateway
    build: ./mail-gateway
    ports:
      - "10025:25"  # SMTP port
    environment:
      - SMTP_HOST=smtp.google.com
      - SMTP_PORT=587
    depends_on:
      - nginx

  # Nginx (reverse proxy + SSL)
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - product-server
      - api
      - mail-gateway

volumes:
  postgres_data:
