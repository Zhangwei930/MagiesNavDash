name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Nuxt 4 / recent Babel deps expect ^22.18 or >=24
          node-version: 24
          cache: npm

      # Lockfile is maintained with npm 11; npm 10's npm ci rejects nested
      # optional deps (e.g. @emnapi/runtime) that 11 already resolved.
      - name: Align npm
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  backend:
    name: Backend (test + jar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Boot jar
        run: ./gradlew bootJar --no-daemon
